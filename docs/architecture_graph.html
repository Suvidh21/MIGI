<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DR. MIGI — Graphify Architecture Map</title>
    <meta name="description" content="Interactive codebase architecture graph for DR. MIGI AI Healthcare Companion">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #06080d;
            --bg-secondary: #0c1018;
            --bg-card: #111827;
            --bg-hover: #1a2236;
            --border: #1e293b;
            --border-glow: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-blue: #38bdf8;
            --accent-cyan: #22d3ee;
            --accent-purple: #a78bfa;
            --accent-pink: #f472b6;
            --accent-green: #4ade80;
            --accent-orange: #fb923c;
            --accent-red: #f87171;
            --accent-yellow: #facc15;
        }

        html, body {
            width: 100%; height: 100%;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }

        /* ─── Canvas ─── */
        #graph-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        /* ─── Header ─── */
        .header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 28px;
            background: linear-gradient(180deg, rgba(6,8,13,0.95) 0%, rgba(6,8,13,0.7) 100%);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-logo {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 0 24px rgba(56,189,248,0.25);
        }

        .header-title {
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
        }

        .header-subtitle {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .legend-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 600;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            transition: all 0.2s;
            cursor: pointer;
            user-select: none;
        }

        .legend-chip:hover {
            border-color: var(--border-glow);
            background: var(--bg-hover);
        }

        .legend-chip.active {
            border-color: currentColor;
            opacity: 1;
        }

        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* ─── Detail Panel ─── */
        .detail-panel {
            position: fixed;
            right: -420px;
            top: 68px;
            bottom: 0;
            width: 400px;
            z-index: 90;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border);
            padding: 28px 24px;
            overflow-y: auto;
            transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: -8px 0 40px rgba(0,0,0,0.5);
        }

        .detail-panel.open {
            right: 0;
        }

        .detail-panel .close-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .detail-panel .close-btn:hover {
            border-color: var(--accent-red);
            color: var(--accent-red);
        }

        .detail-type-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .detail-name {
            font-size: 1.35rem;
            font-weight: 800;
            margin-bottom: 4px;
            letter-spacing: -0.02em;
        }

        .detail-file {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-bottom: 18px;
            padding: 6px 10px;
            background: var(--bg-card);
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        .detail-section {
            margin-bottom: 20px;
        }

        .detail-section h3 {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 8px;
        }

        .detail-section p {
            font-size: 0.88rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .detail-methods {
            list-style: none;
        }

        .detail-methods li {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            padding: 6px 10px;
            margin-bottom: 4px;
            background: var(--bg-card);
            border-radius: 6px;
            border: 1px solid var(--border);
            color: var(--accent-cyan);
        }

        .detail-deps {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .detail-dep-chip {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.72rem;
            font-weight: 600;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }

        /* ─── Stats Bar ─── */
        .stats-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 28px;
            background: linear-gradient(0deg, rgba(6,8,13,0.95) 0%, rgba(6,8,13,0.7) 100%);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        .stats-bar .stat {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stats-bar .stat-value {
            color: var(--accent-blue);
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
        }

        /* ─── Controls ─── */
        .controls {
            position: fixed;
            bottom: 46px;
            left: 20px;
            z-index: 80;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-btn {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
        }

        .control-btn:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            box-shadow: 0 0 16px rgba(56,189,248,0.15);
        }

        /* ─── SVG Styles ─── */
        .link {
            stroke-opacity: 0.2;
            fill: none;
        }

        .link:hover {
            stroke-opacity: 0.6;
        }

        .node-group {
            cursor: pointer;
        }

        .node-circle {
            transition: r 0.3s, stroke-width 0.3s;
        }

        .node-group:hover .node-circle {
            stroke-width: 3;
        }

        .node-label {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            fill: var(--text-primary);
            pointer-events: none;
            text-anchor: middle;
            paint-order: stroke;
            stroke: var(--bg-primary);
            stroke-width: 3px;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .node-sublabel {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 400;
            fill: var(--text-muted);
            pointer-events: none;
            text-anchor: middle;
            font-size: 9px;
            paint-order: stroke;
            stroke: var(--bg-primary);
            stroke-width: 2.5px;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ─── Glow filter ─── */
        .glow-filter {
            filter: url(#glow);
        }

        /* ─── Tooltip ─── */
        .tooltip {
            position: fixed;
            z-index: 200;
            pointer-events: none;
            padding: 8px 14px;
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: 8px;
            font-size: 0.78rem;
            color: var(--text-primary);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            opacity: 0;
            transition: opacity 0.15s;
            max-width: 280px;
        }

        .tooltip.visible { opacity: 1; }

        .tooltip .tt-type {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 2px;
        }

        .tooltip .tt-name {
            font-weight: 700;
            font-size: 0.88rem;
        }

        .tooltip .tt-desc {
            font-size: 0.72rem;
            color: var(--text-secondary);
            margin-top: 4px;
            line-height: 1.4;
        }

        /* ─── Animations ─── */
        @keyframes pulse-ring {
            0% { transform: scale(1); opacity: 0.4; }
            100% { transform: scale(2.2); opacity: 0; }
        }

        .pulse-ring {
            animation: pulse-ring 2s ease-out infinite;
        }

        /* ─── Loading ─── */
        .loading-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            transition: opacity 0.6s;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 3px solid var(--border);
            border-top-color: var(--accent-blue);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: var(--border-glow); border-radius: 3px; }
    </style>
</head>
<body>
    <!-- Loading -->
    <div class="loading-overlay" id="loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">Mapping DR. MIGI Architecture…</div>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <div class="header-logo">🧬</div>
            <div>
                <div class="header-title">DR. MIGI — Graphify</div>
                <div class="header-subtitle">Interactive Codebase Architecture Map</div>
            </div>
        </div>
        <div class="header-right" id="legend">
            <!-- populated dynamically -->
        </div>
    </header>

    <!-- SVG Canvas -->
    <svg id="graph-canvas"></svg>

    <!-- Tooltip -->
    <div class="tooltip" id="tooltip">
        <div class="tt-type" id="tt-type"></div>
        <div class="tt-name" id="tt-name"></div>
        <div class="tt-desc" id="tt-desc"></div>
    </div>

    <!-- Detail Panel -->
    <div class="detail-panel" id="detail-panel">
        <div class="close-btn" id="close-panel" title="Close">✕</div>
        <div id="detail-content"></div>
    </div>

    <!-- Zoom Controls -->
    <div class="controls">
        <div class="control-btn" id="zoom-in" title="Zoom In">+</div>
        <div class="control-btn" id="zoom-out" title="Zoom Out">−</div>
        <div class="control-btn" id="zoom-fit" title="Fit All">⊞</div>
    </div>

    <!-- Stats Bar -->
    <div class="stats-bar">
        <div style="display:flex; gap:24px;">
            <div class="stat">Nodes: <span class="stat-value" id="stat-nodes">0</span></div>
            <div class="stat">Edges: <span class="stat-value" id="stat-edges">0</span></div>
            <div class="stat">Modules: <span class="stat-value" id="stat-modules">0</span></div>
        </div>
        <div style="display:flex; gap:20px; align-items:center;">
            <span>Drag nodes · Scroll to zoom · Click to inspect</span>
            <span style="color:var(--accent-blue); font-weight:600;">Graphify v2.0 (Live Cloud Architecture)</span>
        </div>
    </div>

    <!-- D3.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <script>
    // ═══════════════════════════════════════════════════════════════
    //  DR. MIGI — CODEBASE GRAPH DATA
    // ═══════════════════════════════════════════════════════════════

    const NODE_TYPES = {
        'cloud':     { color: '#38bdf8', label: 'Cloud & Live Hosting',   icon: '☁️' },
        'ui':        { color: '#f87171', label: 'Frontend / UI',          icon: '🖥️' },
        'pipeline':  { color: '#0ea5e9', label: 'RAG Pipeline',           icon: '🔗' },
        'engine':    { color: '#a78bfa', label: 'LLM Engine',             icon: '🧠' },
        'model':     { color: '#f472b6', label: 'Model Weights & Loader', icon: '⚙️' },
        'rag':       { color: '#22d3ee', label: 'RAG Core Component',    icon: '🔍' },
        'prompt':    { color: '#4ade80', label: 'Prompts & Templates',   icon: '📝' },
        'training':  { color: '#ec4899', label: 'Training Pipeline',     icon: '🏋️' },
        'data':      { color: '#fb923c', label: 'Data & Datasets',       icon: '📊' },
        'util':      { color: '#facc15', label: 'Utility',               icon: '🛠️' },
        'script':    { color: '#a3e635', label: 'Data Script',           icon: '📜' },
        'test':      { color: '#818cf8', label: 'Test Suite',            icon: '🧪' },
        'notebook':  { color: '#e879f9', label: 'Notebook / Demo',      icon: '📓' },
        'doc':       { color: '#34d399', label: 'Documentation & Guide', icon: '📚' },
        'external':  { color: '#64748b', label: 'External Foundation',  icon: '📦' },
    };

    const nodes = [
        // ─── Cloud & Live Hosting Layer ───
        {
            id: 'streamlit_cloud', name: 'Streamlit Cloud\n(dr-migi.streamlit.app)', type: 'cloud', size: 40,
            file: 'https://dr-migi.streamlit.app',
            description: '24/7 free cloud deployment on Streamlit Community Cloud. Serves the clinical UI and executes ChromaDB vector search with zero-RAM remote inference.',
            methods: ['HTTP 200', 'Automated GitHub CI/CD sync', 'Encrypted Secrets Management'],
            deps: ['app.py', 'frontend/app.py', 'suvidh21/dr-migi (Hugging Face)'],
        },
        {
            id: 'hf_private_repo', name: 'Hugging Face Hub\n(suvidh21/dr-migi)', type: 'cloud', size: 38,
            file: 'https://huggingface.co/suvidh21/dr-migi',
            description: '100% private Hugging Face model repository storing DR. MIGI fine-tuned safetensors (988 MB), tokenizer, and configs. Protected by private HF_TOKEN.',
            methods: ['model.safetensors (988MB)', 'tokenizer.json', 'chat_template.jinja', 'config.json'],
            deps: ['HF_TOKEN (Streamlit Secrets)', 'QLoRA Merged Weights'],
        },

        // ─── Frontend / Application Layer ───
        {
            id: 'app_shim', name: 'app.py (Root Shim)', type: 'ui', size: 28,
            file: 'app.py',
            description: 'Root entrypoint shim for Streamlit Community Cloud and local launch. Injects project root into sys.path and dynamically executes frontend/app.py.',
            methods: ['sys.path.insert(0, PROJECT_ROOT)', 'exec(frontend/app.py)'],
            deps: ['frontend/app.py'],
        },
        {
            id: 'frontend_app', name: 'frontend/app.py', type: 'ui', size: 38,
            file: 'frontend/app.py',
            description: 'Main Streamlit clinical web app. Features high-contrast dark theme, longitudinal patient profile selector, streaming chat, telemetry pills, and RAG context expander.',
            methods: ['get_inference_engine()', 'get_rag_pipeline()', 'chat_input()', 'st.session_state'],
            deps: ['backend.inference.engine', 'backend.rag.pipeline', 'Streamlit'],
        },

        // ─── Pipeline / Orchestrator ───
        {
            id: 'rag_pipeline', name: 'DrMigiRAGPipeline', type: 'pipeline', size: 42,
            file: 'backend/rag/pipeline.py',
            description: 'The master RAG orchestrator. Combines retrieval (MigiRetriever) with LLM inference (DrMigiEngine). Retrieves relevant patient records → builds grounded clinical prompt → produces evidence-based assessment.',
            methods: ['__init__()', 'ask(patient_id, question)', 'ask_stream(patient_id, question)', '_build_rag_system_prompt(context)'],
            deps: ['DrMigiEngine', 'MigiRetriever', 'MigiEmbedder', 'MigiVectorStore', 'build_rag_messages()'],
        },

        // ─── Phase 1 — LLM Engine ───
        {
            id: 'engine', name: 'DrMigiEngine', type: 'engine', size: 36,
            file: 'backend/inference/engine.py',
            description: 'Dual-mode LLM reasoning brain. In Cloud Mode: queries Hugging Face Inference API with zero RAM usage. In Local Mode: loads local PyTorch model onto CUDA/CPU.',
            methods: ['__init__()', 'generate_response(prompt, system_prompt)', 'generate_stream(prompt, system_prompt)', '_resolve_hf_token()'],
            deps: ['backend.model.loader', 'backend.prompts.templates', 'backend.utils.logger', 'InferenceClient'],
        },

        // ─── Model Loader & Standalone Weights ───
        {
            id: 'loader', name: 'ModelLoader', type: 'model', size: 32,
            file: 'backend/model/loader.py',
            description: 'Intelligent loader. Auto-detects local merged model (models/MIGI-Qwen2.5-0.5B-v1) on disk to avoid re-downloading, or falls back to private Hugging Face repo.',
            methods: ['determine_optimal_device()', 'load_model_and_tokenizer(model_name)'],
            deps: ['configs/inference_config.json', 'models/MIGI-Qwen2.5-0.5B-v1', 'suvidh21/dr-migi', 'AutoModelForCausalLM'],
        },
        {
            id: 'local_merged_model', name: 'MIGI-Qwen2.5-0.5B-v1\n(Merged Weights)', type: 'model', size: 30,
            file: 'models/MIGI-Qwen2.5-0.5B-v1/',
            description: 'Standalone fine-tuned model directory on disk. Contains fused model.safetensors (988 MB), tokenizer.json, and generation configs ready for offline GPU execution.',
            methods: ['model.safetensors (988MB)', 'tokenizer.json', 'chat_template.jinja'],
            deps: ['merge_migi_model.py'],
        },

        // ─── RAG Core Components ───
        {
            id: 'chunker', name: 'PatientRecordChunker', type: 'rag', size: 26,
            file: 'backend/rag/chunker.py',
            description: 'Splits patient JSON records into visit-level clinical chunks (vitals, diagnoses, medications, labs, notes), preserving clinical continuity for semantic retrieval.',
            methods: ['chunk_patient(patient_data)', '_format_visit(header, visit)', 'chunk_from_file(filepath)'],
            deps: ['datasets/patients/*.json'],
        },
        {
            id: 'embedder', name: 'MigiEmbedder', type: 'rag', size: 26,
            file: 'backend/rag/embedder.py',
            description: 'Wraps BAAI/bge-small-en-v1.5 (384-dimensional dense vectors). Encodes patient visit chunks at ingestion time and doctor queries at query time.',
            methods: ['__init__()', 'embed_text(text)', 'embed_batch(texts)', 'get_embedding_dimension()'],
            deps: ['configs/rag_config.json', 'SentenceTransformer'],
        },
        {
            id: 'vector_store', name: 'MigiVectorStore', type: 'rag', size: 28,
            file: 'backend/rag/vector_store.py',
            description: 'Persistent ChromaDB client. Indexes patient embeddings with cosine similarity HNSW index, metadata filtering by patient_id, and automatic fallback ingestion.',
            methods: ['__init__()', 'add_chunks(chunks)', 'search(query, top_k, patient_id)', 'get_patient_chunks(patient_id)'],
            deps: ['MigiEmbedder', 'configs/rag_config.json', 'ChromaDB'],
        },
        {
            id: 'retriever', name: 'MigiRetriever', type: 'rag', size: 26,
            file: 'backend/rag/retriever.py',
            description: 'Bridges raw vector search with prompt synthesis. Retrieves top-k relevant visit records and formats them into a chronologically ordered context string.',
            methods: ['__init__()', 'retrieve(query, patient_id)', 'retrieve_full_timeline(patient_id)'],
            deps: ['MigiVectorStore', 'configs/rag_config.json'],
        },

        // ─── Prompts & Templates ───
        {
            id: 'templates', name: 'Prompt Templates', type: 'prompt', size: 24,
            file: 'backend/prompts/templates.py',
            description: 'Clinical system prompts and chat formatting. Enforces strict clinical qualifiers, disallows prescribing, and injects retrieved evidence blocks.',
            methods: ['build_chat_messages(user_content, system_prompt)', 'build_rag_messages(user_query, patient_context)'],
            deps: ['DR_MIGI_SYSTEM_PROMPT', 'DR_MIGI_RAG_SYSTEM_PROMPT_TEMPLATE'],
        },

        // ─── Training Pipeline ───
        {
            id: 'train_script', name: 'train_migi.py', type: 'training', size: 28,
            file: 'scripts/training/train_migi.py',
            description: 'QLoRA fine-tuning training loop using Hugging Face TRL & SFTTrainer. Trains Qwen 2.5 on 40,000 MedMCQA medical question-answering samples with rank 16 adapters.',
            methods: ['prepare_model()', 'train()', 'compute_metrics()'],
            deps: ['migi_medical_40k/', 'Qwen/Qwen2.5-0.5B-Instruct', 'migi_qlora_output/'],
        },
        {
            id: 'qlora_output', name: 'QLoRA Adapters\n(migi_qlora_output)', type: 'training', size: 26,
            file: 'migi_qlora_output/full_training/',
            description: 'Trained LoRA adapter weights (adapter_model.safetensors 35.2 MB), checkpoint snapshots, and training arguments bin.',
            methods: ['adapter_model.safetensors (35MB)', 'adapter_config.json'],
            deps: ['train_migi.py'],
        },
        {
            id: 'merge_script', name: 'merge_migi_model.py', type: 'training', size: 26,
            file: 'scripts/training/merge_migi_model.py',
            description: 'Fuses LoRA adapters from migi_qlora_output with base Qwen weights to create the standalone production model models/MIGI-Qwen2.5-0.5B-v1.',
            methods: ['merge_and_unload()', 'save_pretrained()'],
            deps: ['migi_qlora_output/', 'models/MIGI-Qwen2.5-0.5B-v1/'],
        },
        {
            id: 'compare_script', name: 'compare_migi.py', type: 'training', size: 22,
            file: 'scripts/training/compare_migi.py',
            description: 'Evaluates base Qwen 2.5 against fine-tuned DR. MIGI side-by-side on clinical test prompts to quantify reasoning gains.',
            methods: ['evaluate_pair(prompt)'],
            deps: ['models/MIGI-Qwen2.5-0.5B-v1', 'Qwen/Qwen2.5-0.5B-Instruct'],
        },

        // ─── Data Pipeline & Datasets ───
        {
            id: 'ingest_script', name: 'ingest_patients.py', type: 'script', size: 24,
            file: 'scripts/data/ingest_patients.py',
            description: 'Loads multi-year patient histories from JSON into ChromaDB via visit chunking and dense vector embedding. Idempotent via upsert.',
            methods: ['main()'],
            deps: ['PatientRecordChunker', 'MigiEmbedder', 'MigiVectorStore'],
        },
        {
            id: 'prepare_dataset', name: 'prepare_migi_dataset.py', type: 'script', size: 22,
            file: 'scripts/data/prepare_migi_dataset.py',
            description: 'Prepares raw MedMCQA medical QA records into Qwen conversational chat template format for QLoRA instruction tuning.',
            methods: ['format_chat_template()', 'save_dataset()'],
            deps: ['migi_medical_40k/'],
        },
        {
            id: 'patient_data', name: 'Patient Records (P001-P003)', type: 'data', size: 24,
            file: 'datasets/patients/*.json',
            description: '3 synthetic longitudinal patient trajectories: P001 (Diabetes progression), P002 (Cardiac NSTEMI), P003 (COPD exacerbation).',
            methods: ['P001_john_doe.json', 'P002_priya_sharma.json', 'P003_ramesh_iyer.json'],
            deps: [],
        },
        {
            id: 'migi_dataset', name: 'migi_medical_40k', type: 'data', size: 24,
            file: 'migi_medical_40k/',
            description: '40,000 curated and cleaned MedMCQA medical examination question-answer pairs formatted for clinical fine-tuning.',
            methods: ['train.json', 'validation.json'],
            deps: ['prepare_migi_dataset.py'],
        },

        // ─── Configuration & Utilities ───
        {
            id: 'inference_config', name: 'inference_config.json', type: 'data', size: 20,
            file: 'configs/inference_config.json',
            description: 'Configuration specifying suvidh21/dr-migi model name, cache paths, and generation parameters (temperature, top_p, top_k).',
            methods: [], deps: [],
        },
        {
            id: 'rag_config', name: 'rag_config.json', type: 'data', size: 20,
            file: 'configs/rag_config.json',
            description: 'RAG hyperparameters: embedding model (BAAI/bge-small-en-v1.5), ChromaDB path, top-k retrieval count, and collection name.',

        {

            methods: ['get_memory_usage()', 'Timer(description)'],
            deps: ['psutil', 'torch'],
        },

        // ─── Documentation & Guides ───
        {
            id: 'deploy_guide', name: 'LIVE_DEPLOYMENT_GUIDE.md', type: 'doc', size: 24,
            file: 'docs/LIVE_DEPLOYMENT_GUIDE.md',
            description: 'Comprehensive architectural guide documenting how DR. MIGI was deployed to a 100% free live URL using Streamlit Cloud and Private Hugging Face Hub.',
            methods: ['Architecture Blueprint', 'IP Protection', 'Secrets Configuration'],
            deps: ['Streamlit Cloud', 'Hugging Face Hub'],
        },
        {
            id: 'lecture_notes', name: 'Engineering Notes (1-10)', type: 'doc', size: 22,
            file: 'docs/notes/*.md',
            description: '10 engineering lectures covering transformers, BPE tokenization, embedding geometries, attention mechanisms, vector databases, and RAG.',
            methods: ['Lectures 01-10'],
            deps: [],
        },

        // ─── Notebooks & Tests ───
        {
            id: 'nb_inference', name: '01_cpu_inference.py', type: 'notebook', size: 18,
            file: 'notebooks/01_cpu_inference.py',
            description: 'Phase 1 walkthrough demonstrating standalone LLM loading and generation.',
            methods: [], deps: ['DrMigiEngine'],
        },
        {
            id: 'nb_tokens', name: '02_explain_tokens.py', type: 'notebook', size: 18,
            file: 'notebooks/02_explain_tokens.py',
            description: 'Deep-dive into Qwen tokenization, subword splits, and vocabulary mapping.',
            methods: [], deps: ['AutoTokenizer'],
        },
        {
            id: 'nb_rag', name: '03_rag_demo.py', type: 'notebook', size: 20,
            file: 'notebooks/03_rag_demo.py',
            description: 'Phase 2 end-to-end RAG demonstration querying all 3 patients from ChromaDB.',
            methods: [], deps: ['DrMigiRAGPipeline'],
        },
        {
            id: 'tests', name: 'test_inference.py', type: 'test', size: 20,
            file: 'tests/test_inference.py',
            description: 'Automated test suite validating engine initialization, response format, and token streaming.',
            methods: ['test_engine_initialization()', 'test_synchronous_generation()'],
            deps: ['DrMigiEngine'],
        },

        // ─── External Foundations ───
        {
            id: 'ext_qwen', name: 'Qwen/Qwen2.5-0.5B-Instruct', type: 'external', size: 22,
            file: 'HuggingFace Hub',
            description: 'Foundation base causal language model used as base for DR. MIGI fine-tuning.',
            methods: [], deps: [],
        },
        {
            id: 'ext_bge', name: 'BAAI/bge-small-en-v1.5', type: 'external', size: 22,
            file: 'HuggingFace Hub',
            description: 'Top-tier 384-dimensional dense semantic embedding model.',
            methods: [], deps: [],
        },
        {
            id: 'ext_chroma', name: 'ChromaDB', type: 'external', size: 22,
            file: 'pip package',
            description: 'Local on-disk vector database with persistent HNSW index.',
            methods: [], deps: [],
        },
    ];

    const links = [
        // Live Cloud Deployment Flow
        { source: 'streamlit_cloud', target: 'app_shim', label: 'hosts & launches' },
        { source: 'streamlit_cloud', target: 'hf_private_repo', label: 'authenticated API queries (HF_TOKEN)' },
        { source: 'app_shim', target: 'frontend_app', label: 'executes forwarding shim' },
        { source: 'frontend_app', target: 'rag_pipeline', label: 'initializes & queries' },
        { source: 'frontend_app', target: 'engine', label: 'direct clinical chat' },

        // Pipeline Orchestration
        { source: 'rag_pipeline', target: 'engine', label: 'generate_response()' },
        { source: 'rag_pipeline', target: 'retriever', label: 'retrieve(query)' },
        { source: 'rag_pipeline', target: 'embedder', label: 'initializes' },
        { source: 'rag_pipeline', target: 'vector_store', label: 'initializes' },
        { source: 'rag_pipeline', target: 'templates', label: 'build_rag_messages()' },

        // Engine & Loader Flow
        { source: 'engine', target: 'loader', label: 'load_model_and_tokenizer()' },
        { source: 'engine', target: 'templates', label: 'build_chat_messages()' },
        { source: 'engine', target: 'logger', label: 'logging & Timer' },
        { source: 'loader', target: 'local_merged_model', label: 'loads from disk (PC)' },
        { source: 'loader', target: 'hf_private_repo', label: 'loads from private hub (Cloud)' },
        { source: 'loader', target: 'inference_config', label: 'reads config' },

        // Training & Merging Pipeline
        { source: 'train_script', target: 'ext_qwen', label: 'base model' },
        { source: 'train_script', target: 'migi_dataset', label: 'trains on MedMCQA' },
        { source: 'train_script', target: 'qlora_output', label: 'outputs adapters' },
        { source: 'merge_script', target: 'qlora_output', label: 'reads adapters' },
        { source: 'merge_script', target: 'local_merged_model', label: 'generates standalone model' },
        { source: 'local_merged_model', target: 'hf_private_repo', label: 'uploaded to private repo' },
        { source: 'compare_script', target: 'local_merged_model', label: 'evaluates' },

        // RAG Storage Chain
        { source: 'retriever', target: 'vector_store', label: 'search()' },
        { source: 'vector_store', target: 'embedder', label: 'embed_text/batch()' },
        { source: 'vector_store', target: 'ext_chroma', label: 'PersistentClient' },
        { source: 'embedder', target: 'ext_bge', label: 'SentenceTransformer' },
        { source: 'vector_store', target: 'rag_config', label: 'reads config' },
        { source: 'embedder', target: 'rag_config', label: 'reads config' },
        { source: 'retriever', target: 'rag_config', label: 'reads config' },

        // Data Ingestion Chain
        { source: 'ingest_script', target: 'chunker', label: 'chunk_from_file()' },
        { source: 'ingest_script', target: 'embedder', label: 'embeds visit chunks' },
        { source: 'ingest_script', target: 'vector_store', label: 'add_chunks()' },
        { source: 'chunker', target: 'patient_data', label: 'parses JSON records' },
        { source: 'prepare_dataset', target: 'migi_dataset', label: 'formats medical QA' },

        // Documentation Connections
        { source: 'deploy_guide', target: 'streamlit_cloud', label: 'documents live app' },
        { source: 'deploy_guide', target: 'hf_private_repo', label: 'documents private hub' },

        // Verification & Demos
        { source: 'tests', target: 'engine', label: 'validates' },
        { source: 'nb_inference', target: 'engine', label: 'demonstrates' },
        { source: 'nb_rag', target: 'rag_pipeline', label: 'demonstrates' },
    ];

    // ═══════════════════════════════════════════════════════════════
    //  GRAPH RENDERING WITH D3.JS
    // ═══════════════════════════════════════════════════════════════

    const width = window.innerWidth;
    const height = window.innerHeight;

    const svg = d3.select('#graph-canvas')
        .attr('width', width)
        .attr('height', height);

    // Glow filter
    const defs = svg.append('defs');
    const filter = defs.append('filter').attr('id', 'glow');
    filter.append('feGaussianBlur').attr('stdDeviation', '4').attr('result', 'coloredBlur');
    const feMerge = filter.append('feMerge');
    feMerge.append('feMergeNode').attr('in', 'coloredBlur');
    feMerge.append('feMergeNode').attr('in', 'SourceGraphic');

    // Arrow markers
    defs.append('marker')
        .attr('id', 'arrow')
        .attr('viewBox', '0 -5 10 10')
        .attr('refX', 28)
        .attr('refY', 0)
        .attr('markerWidth', 6)
        .attr('markerHeight', 6)
        .attr('orient', 'auto')
        .append('path')
        .attr('d', 'M0,-4L10,0L0,4')
        .attr('fill', '#334155');

    const g = svg.append('g');

    // Zoom
    const zoom = d3.zoom()
        .scaleExtent([0.15, 4])
        .on('zoom', (e) => g.attr('transform', e.transform));
    svg.call(zoom);

    // Force simulation
    const simulation = d3.forceSimulation(nodes)
        .force('link', d3.forceLink(links).id(d => d.id).distance(180).strength(0.4))
        .force('charge', d3.forceManyBody().strength(-800))
        .force('center', d3.forceCenter(width / 2, height / 2))
        .force('collision', d3.forceCollide().radius(d => d.size + 20))
        .force('x', d3.forceX(width / 2).strength(0.04))
        .force('y', d3.forceY(height / 2).strength(0.04));

    // Links
    const linkElements = g.append('g')
        .selectAll('line')
        .data(links)
        .enter()
        .append('line')
        .attr('class', 'link')
        .attr('stroke', d => {
            const sourceNode = nodes.find(n => n.id === (typeof d.source === 'string' ? d.source : d.source.id));
            return sourceNode ? NODE_TYPES[sourceNode.type].color : '#334155';
        })
        .attr('stroke-width', 1.5)
        .attr('marker-end', 'url(#arrow)');

    // Node groups
    const nodeElements = g.append('g')
        .selectAll('g')
        .data(nodes)
        .enter()
        .append('g')
        .attr('class', 'node-group')
        .call(d3.drag()
            .on('start', dragStart)
            .on('drag', dragging)
            .on('end', dragEnd)
        );

    // Outer glow ring
    nodeElements.append('circle')
        .attr('r', d => d.size + 8)
        .attr('fill', 'none')
        .attr('stroke', d => NODE_TYPES[d.type].color)
        .attr('stroke-width', 1)
        .attr('opacity', 0.15)
        .attr('class', 'pulse-ring');

    // Main node circle
    nodeElements.append('circle')
        .attr('class', 'node-circle glow-filter')
        .attr('r', d => d.size)
        .attr('fill', d => {
            const c = NODE_TYPES[d.type].color;
            return c + '18';  // very transparent fill
        })
        .attr('stroke', d => NODE_TYPES[d.type].color)
        .attr('stroke-width', 2);

    // Inner dot
    nodeElements.append('circle')
        .attr('r', 4)
        .attr('fill', d => NODE_TYPES[d.type].color)
        .attr('opacity', 0.8);

    // Labels
    nodeElements.append('text')
        .attr('class', 'node-label')
        .attr('dy', d => d.size + 16)
        .attr('font-size', d => Math.max(10, d.size / 3.2))
        .text(d => d.name.split('\n')[0]);

    // Sub-labels (for multi-line names)
    nodeElements.filter(d => d.name.includes('\n'))
        .append('text')
        .attr('class', 'node-sublabel')
        .attr('dy', d => d.size + 28)
        .text(d => d.name.split('\n')[1]);

    // File sub-label for single-line names
    nodeElements.filter(d => !d.name.includes('\n') && d.file)
        .append('text')
        .attr('class', 'node-sublabel')
        .attr('dy', d => d.size + 28)
        .text(d => d.file.length > 30 ? '...' + d.file.slice(-28) : d.file);

    // ─── Interactions ───
    const tooltip = d3.select('#tooltip');

    nodeElements
        .on('mouseover', function(event, d) {
            const typeInfo = NODE_TYPES[d.type];

            d3.select('#tt-type').text(typeInfo.label).style('color', typeInfo.color);
            d3.select('#tt-name').text(d.name.replace('\n', ' '));
            d3.select('#tt-desc').text(d.description.slice(0, 140) + (d.description.length > 140 ? '…' : ''));

            tooltip
                .style('left', (event.clientX + 16) + 'px')
                .style('top', (event.clientY - 10) + 'px')
                .classed('visible', true);

            // Highlight connected links
            linkElements
                .attr('stroke-opacity', l =>
                    (l.source.id === d.id || l.target.id === d.id) ? 0.8 : 0.06
                )
                .attr('stroke-width', l =>
                    (l.source.id === d.id || l.target.id === d.id) ? 2.5 : 1
                );

            // Dim other nodes
            nodeElements.select('.node-circle')
                .attr('opacity', n => {
                    if (n.id === d.id) return 1;
                    const connected = links.some(l =>
                        (l.source.id === d.id && l.target.id === n.id) ||
                        (l.target.id === d.id && l.source.id === n.id)
                    );
                    return connected ? 1 : 0.2;
                });
        })
        .on('mousemove', function(event) {
            tooltip
                .style('left', (event.clientX + 16) + 'px')
                .style('top', (event.clientY - 10) + 'px');
        })
        .on('mouseout', function() {
            tooltip.classed('visible', false);
            linkElements.attr('stroke-opacity', 0.2).attr('stroke-width', 1.5);
            nodeElements.select('.node-circle').attr('opacity', 1);
        })
        .on('click', function(event, d) {
            event.stopPropagation();
            openDetailPanel(d);
        });

    // ─── Detail Panel ───
    function openDetailPanel(d) {
        const panel = document.getElementById('detail-panel');
        const content = document.getElementById('detail-content');
        const typeInfo = NODE_TYPES[d.type];

        let html = `
            <div class="detail-type-badge" style="background:${typeInfo.color}22; color:${typeInfo.color}; border:1px solid ${typeInfo.color}44;">
                ${typeInfo.icon} ${typeInfo.label}
            </div>
            <div class="detail-name">${d.name.replace('\n', ' ')}</div>
            <div class="detail-file">${d.file}</div>

            <div class="detail-section">
                <h3>Description</h3>
                <p>${d.description}</p>
            </div>
        `;

        if (d.methods && d.methods.length > 0) {
            html += `<div class="detail-section"><h3>${d.type === 'data' ? 'Files' : 'Methods / API'}</h3><ul class="detail-methods">`;
            d.methods.forEach(m => { html += `<li>${m}</li>`; });
            html += `</ul></div>`;
        }

        // Outgoing dependencies
        const outgoing = links.filter(l => l.source.id === d.id);
        if (outgoing.length > 0) {
            html += `<div class="detail-section"><h3>Depends On (→)</h3><div class="detail-deps">`;
            outgoing.forEach(l => {
                const target = nodes.find(n => n.id === l.target.id);
                const tc = NODE_TYPES[target.type].color;
                html += `<span class="detail-dep-chip" style="border-color:${tc}44; color:${tc}">${target.name.replace('\n', ' ')}</span>`;
            });
            html += `</div></div>`;
        }

        // Incoming dependencies
        const incoming = links.filter(l => l.target.id === d.id);
        if (incoming.length > 0) {
            html += `<div class="detail-section"><h3>Used By (←)</h3><div class="detail-deps">`;
            incoming.forEach(l => {
                const source = nodes.find(n => n.id === l.source.id);
                const sc = NODE_TYPES[source.type].color;
                html += `<span class="detail-dep-chip" style="border-color:${sc}44; color:${sc}">${source.name.replace('\n', ' ')}</span>`;
            });
            html += `</div></div>`;
        }

        content.innerHTML = html;
        panel.classList.add('open');
    }

    document.getElementById('close-panel').addEventListener('click', () => {
        document.getElementById('detail-panel').classList.remove('open');
    });

    svg.on('click', () => {
        document.getElementById('detail-panel').classList.remove('open');
    });

    // ─── Legend ───
    const legendContainer = document.getElementById('legend');
    const activeTypes = new Set(Object.keys(NODE_TYPES));

    Object.entries(NODE_TYPES).forEach(([key, info]) => {
        const count = nodes.filter(n => n.type === key).length;
        if (count === 0) return;

        const chip = document.createElement('div');
        chip.className = 'legend-chip active';
        chip.innerHTML = `<span class="legend-dot" style="background:${info.color}"></span>${info.label} (${count})`;
        chip.addEventListener('click', () => {
            if (activeTypes.has(key)) {
                activeTypes.delete(key);
                chip.classList.remove('active');
                chip.style.opacity = '0.35';
            } else {
                activeTypes.add(key);
                chip.classList.add('active');
                chip.style.opacity = '1';
            }
            filterGraph();
        });
        legendContainer.appendChild(chip);
    });

    function filterGraph() {
        nodeElements.attr('display', d => activeTypes.has(d.type) ? null : 'none');
        linkElements.attr('display', d => {
            const src = typeof d.source === 'string' ? d.source : d.source.id;
            const tgt = typeof d.target === 'string' ? d.target : d.target.id;
            const srcNode = nodes.find(n => n.id === src);
            const tgtNode = nodes.find(n => n.id === tgt);
            return (srcNode && tgtNode && activeTypes.has(srcNode.type) && activeTypes.has(tgtNode.type)) ? null : 'none';
        });
    }

    // ─── Stats ───
    document.getElementById('stat-nodes').textContent = nodes.length;
    document.getElementById('stat-edges').textContent = links.length;
    document.getElementById('stat-modules').textContent = new Set(nodes.map(n => n.type)).size;

    // ─── Zoom Controls ───
    document.getElementById('zoom-in').addEventListener('click', () => svg.transition().call(zoom.scaleBy, 1.3));
    document.getElementById('zoom-out').addEventListener('click', () => svg.transition().call(zoom.scaleBy, 0.7));
    document.getElementById('zoom-fit').addEventListener('click', () => {
        svg.transition().duration(750).call(zoom.transform, d3.zoomIdentity
            .translate(width / 2, height / 2)
            .scale(0.7)
            .translate(-width / 2, -height / 2));
    });

    // ─── Drag handlers ───
    function dragStart(event, d) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x; d.fy = d.y;
    }
    function dragging(event, d) {
        d.fx = event.x; d.fy = event.y;
    }
    function dragEnd(event, d) {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null; d.fy = null;
    }

    // ─── Tick ───
    simulation.on('tick', () => {
        linkElements
            .attr('x1', d => d.source.x)
            .attr('y1', d => d.source.y)
            .attr('x2', d => d.target.x)
            .attr('y2', d => d.target.y);

        nodeElements.attr('transform', d => `translate(${d.x},${d.y})`);
    });

    // ─── Remove loading screen ───
    setTimeout(() => {
        document.getElementById('loading').classList.add('hidden');
    }, 1200);

    // ─── Resize ───
    window.addEventListener('resize', () => {
        const w = window.innerWidth;
        const h = window.innerHeight;
        svg.attr('width', w).attr('height', h);
        simulation.force('center', d3.forceCenter(w / 2, h / 2));
        simulation.alpha(0.3).restart();
    });
    </script>
